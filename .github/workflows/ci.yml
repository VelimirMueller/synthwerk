# Fleet standard ci.yml (library tier). Stages call VelimirMueller/fleet-workflows at v0.0.2.
# The hub holds docs, lint configs and helper scripts: no package and no unit tests (fleet.yml).
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e stage
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  lint:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-lint.yml@v0.0.2
    with:
      stack: python
      install-command: "true"
      command: >-
        python3 scripts/check-ascii.py README.md docs/*.md &&
        uvx ruff@0.17.0 check scripts &&
        npx --yes @biomejs/biome@2.5.15 lint --diagnostic-level=warn . &&
        git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n &&
        git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=warning

  unit:
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-unit.yml@v0.0.2
    with:
      stack: generic
      command: echo "No unit tests, the hub has no library code (fleet.yml exception CI-UNIT-01)."
      coverage-floor: 0

  e2e:
    needs: [changes, unit]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e2e }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-e2e.yml@v0.0.2
    with:
      stack: generic
      command: echo "No e2e tests in the hub."

  build:
    needs: [changes, e2e]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-build.yml@v0.0.2
    with:
      stack: generic
      command: echo "Nothing to build, the hub publishes no package (fleet.yml exception CI-BUILD-04)."
      pack: false

  conclusion:
    needs: [changes, lint, unit, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or a required stage was skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done
          if [ "$CODE" = "true" ]; then
            for r in "$LINT" "$UNIT" "$BUILD"; do
              [ "$r" = "success" ] || { echo "::error::a required stage did not run"; exit 1; }
            done
          fi
