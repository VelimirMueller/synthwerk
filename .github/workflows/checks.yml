# Checks of the map repo: ASCII art, synthwerk links, script and shell lint.
# Required check for the ruleset on main: "required".
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  ascii:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check-ascii (README, docs, assets/ascii)
        run: python3 scripts/check-ascii.py README.md docs/*.md

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check-links (README, docs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-links.sh README.md docs/*.md

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.30"
      - name: ruff (scripts/*.py)
        run: uvx ruff@0.17.0 check scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Biome (scripts/*.mjs, .figma)
        run: npx --yes @biomejs/biome@2.5.15 lint --diagnostic-level=warn .

  # Shell scripts: bash syntax check and shellcheck (warning and above).
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n (*.sh)
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      - name: shellcheck --severity=warning (*.sh)
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=warning

  required:
    if: always()
    needs: [ascii, links, lint, shell]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || exit 1
          done
