# Weekly, grouped, one PR per ecosystem (CI-COST-04). No package manifest: only the action pins.
# No target-branch: updates go to the default branch (main now, develop once the control repo makes it the default, fleet-standard#7).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
