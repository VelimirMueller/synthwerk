# Weekly, grouped, one PR per ecosystem (CI-COST-04). No package manifest: only the action pins.
# target-branch develop: Dependabot opens no PR until the control repo creates develop (fleet-standard#7).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
