# fleet.yml: tier and visibility of this repo (STANDARD.md). Exceptions: docs/rollout.md.
tier: library
visibility: public
exceptions:
  - rule: CI-UNIT-01
    value: none
    reason: The hub holds docs, lint configs and helper scripts; it has no library code and no unit tests.
  - rule: CI-BUILD-04
    value:
      pack: false
    reason: The hub publishes no package, so there is nothing to build or pack.
  - rule: GOV-RS-02
    value: no develop ruleset
    reason: The repo has no develop branch yet; the control repo creates it and its ruleset when is_enforced flips (fleet-standard#7).
  - rule: GOV-RS-03
    value: no develop ruleset
    reason: The repo has no develop branch yet; the control repo sets the required checks with it (fleet-standard#7).
  - rule: GOV-RS-04
    value: "main: required check `conclusion`, no stage branch"
    reason: The main ruleset predates the standard (its required check moved from `required` to `conclusion` on 2026-10-28) and there is no stage branch; the control repo replaces the ruleset (fleet-standard#7).
  - rule: GOV-ENV-10
    value: no release environment
    reason: The hub publishes no release, so it has no release environment.
